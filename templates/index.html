<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake News Detector</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<style>
body{font-family:sans-serif; background:linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; display:flex; justify-content:center; align-items:center; margin:0; padding:15px;}
.card{background:#fff; width:100%; max-width:420px; border-radius:24px; padding:22px; box-shadow:0 10px 30px rgba(0,0,0,0.2);}
h1{text-align:center; font-size:26px; margin:5px 0 18px;}
.btns{display:flex; gap:10px; margin-bottom:15px;}
.btn{flex:1; padding:12px; border:none; border-radius:12px; font-weight:700; cursor:pointer;}
.btn-gallery{background:#e3f2fd; color:#1565c0;}
.btn-camera{background:#f3e5f5; color:#6a1b9a;}
textarea{width:100%; height:110px; border:2px solid #e0e0e0; border-radius:14px; padding:12px; font-size:15px; box-sizing:border-box; resize:none;}
.check{width:100%; margin-top:14px; background:#000; color:#fff; border:none; padding:14px; border-radius:14px; font-size:17px; font-weight:700; cursor:pointer;}
.result{margin-top:16px; padding:16px; border-radius:14px; text-align:center; display:none;}
.result.real{background:#e8f5e9; border:2px solid #4caf50; color:#2e7d32;}
.result.fake{background:#ffebee; border:2px solid #f44336; color:#c62828;}
.result.error{background:#ffebee; border:2px solid #f44336; color:#b71c1c;}
#preview{width:100%; max-height:200px; object-fit:contain; border-radius:12px; margin-top:10px; display:none;}
#crop-modal{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; flex-direction:column; justify-content:center; align-items:center; padding:15px; box-sizing:border-box;}
#crop-modal.show{display:flex;}
#crop-image{max-width:95%; max-height:65vh;}
.crop-actions{margin-top:15px; display:flex; gap:12px;}
</style>
</head>
<body>
<div class="card">
<h1>📰 Fake News Detector</h1>

<div class="btns">
<button class="btn btn-gallery" onclick="document.getElementById('galleryInput').click()">📁 Gallery</button>
<button class="btn btn-camera" onclick="openCamera()">📸 Camera</button>
</div>

<input type="file" id="galleryInput" accept="image/*" style="display:none">
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">

<textarea id="newsText" placeholder="Or paste news text here to check..."></textarea>
<img id="preview">

<button class="check" onclick="checkNews()">🔍 Check Real or Fake</button>

<div id="result" class="result"></div>
</div>

<!-- CROP MODAL FOR BOTH GALLERY & CAMERA -->
<div id="crop-modal">
<img id="crop-image">
<div class="crop-actions">
<button onclick="doCrop()" style="padding:12px 20px; background:#000; color:#fff; border:none; border-radius:10px; font-weight:700;">✅ Crop & Use</button>
<button onclick="closeCrop()" style="padding:12px 20px; background:#fff; color:#000; border:none; border-radius:10px; font-weight:700;">❌ Cancel</button>
</div>
</div>

<script>
let cropper;
let selectedFile = null;

function openCamera(){
  document.getElementById('cameraInput').click();
}

function handleFile(file){
  if(!file) return;
  const url = URL.createObjectURL(file);
  document.getElementById('crop-image').src = url;
  document.getElementById('crop-modal').classList.add('show');
  setTimeout(()=>{
    if(cropper) cropper.destroy();
    cropper = new Cropper(document.getElementById('crop-image'), {
      viewMode:1,
      aspectRatio: NaN,
      autoCropArea: 0.9
    });
  },200);
}

document.getElementById('galleryInput').addEventListener('change', e=>{
  handleFile(e.target.files[0]);
});
document.getElementById('cameraInput').addEventListener('change', e=>{
  handleFile(e.target.files[0]);
});

function closeCrop(){
  document.getElementById('crop-modal').classList.remove('show');
  if(cropper) cropper.destroy();
  document.getElementById('galleryInput').value='';
  document.getElementById('cameraInput').value='';
}

function doCrop(){
  const canvas = cropper.getCroppedCanvas({maxWidth:1600, maxHeight:1600});
  canvas.toBlob(blob=>{
    selectedFile = new File([blob], "cropped.jpg", {type:"image/jpeg"});
    const preview = document.getElementById('preview');
    preview.src = URL.createObjectURL(selectedFile);
    preview.style.display='block';
    closeCrop();
  }, 'image/jpeg', 0.92);
}

async function checkNews(){
  const text = document.getElementById('newsText').value;
  const resultDiv = document.getElementById('result');

  if(!text &&!selectedFile){
    resultDiv.style.display='block';
    resultDiv.className='result error';
    resultDiv.innerHTML='Please select image or paste text';
    return;
  }

  resultDiv.style.display='block';
  resultDiv.className='result';
  resultDiv.style.background='#fff3e0';
  resultDiv.innerHTML='⏳ Checking...';

  const formData = new FormData();
  formData.append('news_text', text);
  if(selectedFile) formData.append('image', selectedFile);

  try{
    const res = await fetch('/check', {method:'POST', body:formData});
    const data = await res.json();

    if(data.status === 'error'){
      resultDiv.className='result error';
      resultDiv.innerHTML=`<b>Could not read text from image</b><br><small>OCR Error: ${data.message}. Try clearer image or type text.</small>`;
    } else {
      if(data.label === 'FAKE'){
        resultDiv.className='result fake';
        resultDiv.innerHTML=`<h2 style="margin:0;">❌ FAKE NEWS</h2><p>Confidence: ${data.confidence}%<br><small>${data.reason}</small></p><small style="opacity:0.7">${data.extracted_text}</small>`;
      } else {
        resultDiv.className='result real';
        resultDiv.innerHTML=`<h2 style="margin:0;">✅ REAL NEWS</h2><p>Confidence: ${data.confidence}%<br><small>${data.reason}</small></p><small style="opacity:0.7">${data.extracted_text}</small>`;
      }
    }
  } catch(err){
    resultDiv.className='result error';
    resultDiv.innerHTML='Server error. Try again.';
  }
}
</script>
</body>
</html>
