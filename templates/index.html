<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fake News Detector</title>
</head>
<body style="font-family:Arial;padding:20px;background:#f5f5f5">
<div style="max-width:500px;margin:auto;background:white;padding:20px;border-radius:10px">
<h2 style="text-align:center">Fake News Detector</h2>
<form action="/predict" method="POST" enctype="multipart/form-data">
<input type="file" name="news_image" accept="image/*" style="width:100%;margin:10px 0;padding:10px;border:1px solid #ddd;border-radius:5px">
<textarea name="news_text" placeholder="Or paste text here" style="width:100%;height:80px;padding:10px;margin:10px 0"></textarea>
<button type="submit" style="width:100%;padding:12px;background:black;color:white;border:none;border-radius:5px">Predict</button>
</form>
{% if prediction %}
<div style="margin-top:20px;padding:15px;background:#e8f5e9;border-radius:8px;text-align:center">
<h3>{{ prediction }}</h3>
<p>{{ confidence }}</p>
{% if input_text %}<small>{{ input_text }}</small>{% endif %}
</div>
{% endif %}
</div>
</body>
</html>
